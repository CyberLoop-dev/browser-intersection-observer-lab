<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intersection Observer Lab</title><link rel="stylesheet" href="/styles.css"></head><body><header><p class="eyebrow">BROWSER API LAB</p><h1>Intersection Observer</h1><p>Scroll through the targets and watch their visibility change.</p><div class="controls"><label>Root margin <select id="margin"><option>0px</option><option>80px</option><option>-40px</option><option>0px 0px -120px 0px</option></select></label><label>Threshold <select id="threshold"><option value="0">0</option><option value="0.25">0.25</option><option value="0.5" selected>0.5</option><option value="0.75">0.75</option><option value="1">1</option></select></label><button id="apply">Apply options</button></div><p id="status" role="status"></p></header><main><h2>Observed targets</h2><p>Each card reports its current intersection ratio.</p><section id="targets" class="targets"></section></main><aside><h2>Latest entries</h2><ol id="log" aria-live="polite"></ol></aside><script src="/app.js"></script></body></html>
